[sssd]
config_file_version = 2
services = nss, pam, ssh
domains = EDU.GVA.ES

[nss]
filter_users = root
filter_groups = root
override_shell = /bin/bash

[pam]
[sudo]
[domain/EDU.GVA.ES]
id_provider = ldap
auth_provider = krb5
chpass_provider = krb5
access_provider = simple
autofs_provider = none
enumerate = false
ignore_group_members = true
dns_discovery_domain = ldapad.edu.gva.es
debug_level = 0
# URL del servidor LDAP.
# Consulta via DNS para determinar los AD del dominio generalitat.gva.es. Se puede forzar los servidore poniendo la IP o nombre DNS separado por comas
#       ldap_uri = ldap://sdc071849.generalitat.gva.es, ldap://sdc071851.generalitat.gva.es, _srv_
ldap_uri = ldap://ldapad.edu.gva.es
ldap_search_base = dc=edu,dc=gva,dc=es
ldap_schema = ad
ldap_id_mapping = true
ldap_user_object_class = user
# Sobreescribimos el home del usuario ofrecido por el Active Directory
# por el recurso NFS /home/usuarios/USUARIO que se monta mediante autofs
# ldap_user_home_directory          = homeDirectory
fallback_homedir = /home/%u
#ldap_user_principal                 = userPrincipalName
# Active Directory User Cannot Login When UserPrincipalName (UPN)
# is Different Than Default Realm When Using SSSD's AD Provider
#   Con el cambio a office365 se ha modificado el campo UPN al
# usuario de correo cambiando de dominio @gva.es
# https://access.redhat.com/solutions/774663
ldap_user_principal = nonExistingAttribute
ldap_user_name = sAMAccountName
ldap_user_shell = loginShell
ldap_user_gecos = displayName
ldap_user_uid_number = uidName
ldap_group_object_class = group
ldap_user_gid_number = GIDNumer
ldap_access_order = expire
ldap_account_expire_policy = ad
ldap_force_upper_case_realm = true
ldap_referrals = false
ldap_tls_reqcert = demand
ldap_tls_cacert = /etc/pki/tls/certs/ca-bundle.crt
ldap_tls_cacertdir = /etc/pki/tls/certs
ldap_sudo_search_base = cn=EDUCACION,dc=edu,dc=gva,dc=es
# Control de acceso a las maquinas
#
# via LDAP
# Indicamos que rama de la LDAP contiene el grupo o grupos con permisos para acceder a la maquina.
#   access_provider = ldap
#   ldap_access_filter = memberOf=cn=14831ADMASL,ou="GENERALITAT VALENCIANA",dc=gva,dc=local
# via MANUAL
# Indicamos manualmente los grupos de la LDAP que tienen permisos para acceder a la maquina
#    access_provider = simple
#    simple_allow_groups = GS_VRA, 14831ADMASL
#    simple_allow_groups = EDU_CALSISTEMAS, 14831ADMASL, ADMIN_SISCOM, 14831ADMASA, ADMIN_SISCOM
 
# Consulta LDAP
#
# Usuario para enlazarnos a la LDAP y poder realizar consultas
ldap_default_bind_dn = cn=consulta_DA,ou=educacion,dc=edu,dc=gva,dc=es
ldap_default_authtok_type = password
ldap_default_authtok = uLt8w_uf
# Kerberos v5
# KDC Primario
# Realizamos la busqueda del KDC via DNS
krb5_server = ldapad.edu.gva.es
#KDC Backup
# Si falla la busqueda del KDC via DNS utilizamos el servidor KDC backup.
# Tras las pruebas realizadas para verificar el HA en el dominio GENERALITAT
# no es necesario especificar un servidor de Backup. El sssd conmuta al siguiente
# controlador de la lista obtenida por DNS.
# AXIS-51543: Pruebas de verificacion de HA en sssd
# krb5_backup_server            = sdc071849.generalitat.gva.es
# KDC Primario
# Realizamos la busqueda del KDC/KPASSWD via DNS
krb5_kpasswd = ldapad.edu.gva.es
# KDC Backup
# Si falla la busqueda del KDC/KPASSWD via DNS utilizamos el servidor KDC_BACKUP
# AXIS-51543: Pruebas de verificacion de HA en sssd
# krb5_backup_kpasswd           = sdc071851.generalitat.gva.es
# Dominio Kerberos
krb5_realm = EDU.GVA.ES
#   krb5_changepw_principle = kadmin/changepw
krb5_ccachedir = /tmp
krb5_ccname_template = FILE:%d/krb5cc_%U_XXXXXX
krb5_auth_timeout = 30

