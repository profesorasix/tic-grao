- name: Add github-cli repo using key from URL
  ansible.builtin.deb822_repository:
    name: github-cli
    types: deb
    uris: https://cli.github.com/packages/
    suites: 'stable'
    components: main
    architectures: amd64
    signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg

- name: Install gh packages
  ansible.builtin.apt:
    update_cache: yes
    state: latest
    pkg: gh
