- name: Add repo using key from URL
  ansible.builtin.deb822_repository:
    name: sublime-text
    types: deb
    uris: https://download.sublimetext.com/
    suites: 'apt/stable/'
    architectures: amd64
    signed_by: https://download.sublimetext.com/sublimehq-pub.gpg

- name: Install packages
  ansible.builtin.apt:
    update_cache: no
    state: latest
    pkg: sublime-text
